<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <main id="content">
            <!-- Record Page -->
            <div id="page-record" class="page active">
                <div class="input-group">
                    <label>How much have you spent?</label>
                    <input type="number" id="input-amount" placeholder="Amount">
                    <span class="error-msg" id="error-amount"></span>
                </div>
                <div class="input-group">
                    <label>Which category you spent on?</label>
                    <select id="input-type">
                        <option value="" disabled selected>Type</option>
                    </select>
                    <span class="error-msg" id="error-type"></span>
                </div>
                <div class="input-group">
                    <label>Where have you spent?</label>
                    <input type="text" id="input-detail" placeholder="Detail">
                    <span class="error-msg" id="error-detail"></span>
                </div>
                <button id="btn-record" class="primary-btn">Record</button>
            </div>

            <!-- Query Page -->
            <div id="page-query" class="page">
                <div class="input-group">
                    <label>Select a month</label>
                    <select id="select-month"></select>
                </div>
                <table class="data-table" id="table-summary">
                    <thead>
                        <tr><th>CATEGORY</th><th>AMOUNT</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Logs Page -->
            <div id="page-logs" class="page">
                <div class="btn-row">
                    <input type="file" id="import-file" accept=".csv, text/csv, application/csv, text/comma-separated-values, text/*" style="display: none;">
                    <button id="btn-import-logs" class="primary-btn"><span class="material-icons">file_download</span> Import</button>
                    <button id="btn-export-logs" class="primary-btn"><span class="material-icons">file_upload</span> Export</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table" id="table-logs">
                        <thead>
                            <tr><th>SL</th><th>TIME</th><th>AMOUNT</th><th>TYPE</th><th>DETAIL</th><th> </th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <!-- Pagination Controls -->
                <div class="pagination-controls">
                    <button id="btn-prev-page" class="secondary-btn" disabled><span class="material-icons">chevron_left</span></button>
                    <span id="page-indicator">Page 1 of 1</span>
                    <button id="btn-next-page" class="secondary-btn" disabled><span class="material-icons">chevron_right</span></button>
                </div>
            </div>

            <!-- Settings Page -->
            <div id="page-settings" class="page">
                <div class="settings-section">
                    <div class="section-header">APPEARANCE</div>
                    <div class="card">
                        <div class="setting-row" onclick="toggleTheme()">
                            <div class="icon-box" style="background: #2C2C2E;"><span class="material-icons">dark_mode</span></div>
                            <div class="setting-text">
                                <div class="title">App Theme</div>
                                <div class="subtitle" id="set-theme">Light</div>
                            </div>
                            <span class="material-icons chevron">sync</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Navigation Bar -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-target="page-record">
                <span class="material-icons">edit</span><span>Record</span>
            </div>
            <div class="nav-item" data-target="page-query">
                <span class="material-icons">search</span><span>Query</span>
            </div>
            <div class="nav-item" data-target="page-logs">
                <span class="material-icons">description</span><span>Logs</span>
            </div>
            <div class="nav-item" data-target="page-settings">
                <span class="material-icons">settings</span><span>Settings</span>
            </div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
